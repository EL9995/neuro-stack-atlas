# Publishes the site to GitHub Pages on every push to main.
# Only the files visitors need are uploaded: the original artifact (baseline/),
# the review tools (tools/), README images (docs/) and editing guides stay in
# the repository but are not served on the live site.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html favicon.svg og-image.png .nojekyll css js content _site/
          rm -f _site/content/*.md
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
